# One-click deploy to Render (pair with a MongoDB Atlas cluster).
services:
  - type: web
    name: rupeewise
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
