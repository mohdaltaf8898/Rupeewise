services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  app:
    build: .
    restart: unless-stopped
    ports: ["5000:5000"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/rupeewise
      PORT: 5000
    depends_on: [mongo]

volumes:
  mongo_data:
